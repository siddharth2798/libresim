# Flatpak manifest: wraps the prebuilt Linux release (build/libresim-<v>-linux-x86_64.tar.gz).
#   flatpak install --user flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08 org.flatpak.Builder
#   flatpak run org.flatpak.Builder --user --install --force-clean build/flatpak packaging/flatpak/org.freesim.FreeSim.yml
#   flatpak run org.freesim.FreeSim
app-id: org.freesim.FreeSim
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: libresim
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --device=input      # joysticks / yokes
  - --env=FREESIM_DATA=/app/lib/libresim/data
modules:
  - name: libresim
    buildsystem: simple
    sources:
      - type: archive
        path: ../../build/libresim-0.1.0-dev-linux-x86_64.tar.gz
      - type: file
        path: org.freesim.FreeSim.metainfo.xml
    build-commands:
      - mkdir -p /app/lib/libresim /app/bin
      - cp -r . /app/lib/libresim/
      - ln -s /app/lib/libresim/libresim.sh /app/bin/libresim
      - install -Dm644 libresim.desktop /app/share/applications/org.freesim.FreeSim.desktop
      - sed -i 's/^Icon=.*/Icon=org.freesim.FreeSim/' /app/share/applications/org.freesim.FreeSim.desktop
      - install -Dm644 libresim.png /app/share/icons/hicolor/512x512/apps/org.freesim.FreeSim.png
      - install -Dm644 org.freesim.FreeSim.metainfo.xml /app/share/metainfo/org.freesim.FreeSim.metainfo.xml
